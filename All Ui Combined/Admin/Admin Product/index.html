<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="log-form">
      <div class="header">
        <h1 class="header-1">Add Product</h1>
        <p class="header-title">Enter your product details and Images</p>
      </div>
      <form action="">
        <div class="product_details">
          <input type="text" placeholder="Enter Product Name" />
          <input type="text" placeholder="Enter Product Price" />
        </div>
        <div class="product_details">
          <input type="file" placeholder="Choose Images" />
          <input type="file" placeholder="Choose Images" />
        </div>
        <div class="product_details">
          <input type="file" placeholder="Choose Images" />
          <input type="text" placeholder="Product Details" />
        </div>
        <button>Add Product</button>
      </form>
    </div>
    <div class="Dashboard">
      <h1 class="header-1">All Products</h1>
      <div class="all">
          <div class="tiles">
            <div class="tile 1">
              <img src="../../images/jbl.jpg" alt="">
              <h5 style="color: gray;">JBL</h5>
              <h4>JBL Flip 4 Waterproof Portable Bluetooth Speaker</h4>
              <p class="price">LKR 30,000</p>
              <p class="stock">In Stock</p>
              <div class="all_buttons">
                <button class="btn" style="width: 200px; margin: 0px; margin-bottom: 10px; background-color: #1e2d7d;">Update</button>
                <button style="background-color: #ff0548; width: 200px; margin: 0px;">Delete</button>
              </div>
          </div>
      </div>
    </div>
  </body>
</html>
