<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="log-form">
      <div class="header">
        <h1 class="header-1">Checkout</h1>
        <p class="header-title">Place Your Order</p>
      </div>
      <div class="checkout">
        <form action="">
          <div class="product_details">
            <input type="text" placeholder="Enter Your Name" />
            <input type="text" placeholder="Enter Your Number" />
          </div>
          <div class="product_details">
            <input type="text" placeholder="Enter Your Email" />
            <select required>
              <option value disabled selected>Payment Method</option>
              <option>Cash On Delivery</option>
              <option>PayPal</option>
              <option>Google Pay</option>
            </select>
          </div>
          <div class="product_details">
            <input type="text" placeholder="Address Line 01" />
            <input type="text" placeholder="Address Line 02" />
          </div>
          <div class="product_details">
            <input type="text" placeholder="Enter Your City" />
            <input type="text" placeholder="Enter Your State" />
          </div>
          <div class="product_details">
            <input type="text" placeholder="Enter Your Country" />
            <input type="text" placeholder="Enter Your Zipcode" />
          </div>
          <button>Place Order</button>
        </form>
        <div class="check">
          <h3>Your Orders</h3>
          <h2>Grand Total: LKR 30,000</h2>
          <div class="product-tile">
            <p>Sony Headset 300ed ($2500/- x 1)</p>
          </div>
          <div class="product-tile">
            <p>Sony Headset 300ed ($2500/- x 1)</p>
          </div>
          <div class="product-tile">
            <p>Sony Headset 300ed ($2500/- x 1)</p>
          </div>
          <div class="product-tile">
            <p>Sony Headset 300ed ($2500/- x 1)</p>
          </div>
          <div class="product-tile">
            <p>Sony Headset 300ed ($2500/- x 1)</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
