<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="contact-form">
      <div class="header">
        <h1 class="header-1">Contact Us</h1>
        <p class="header-title">Want to get in touch with us?</p>
        <p class="header-title">
          Just fill out the form below and we'll get back to you as soon as
          possible.
        </p>
      </div>
      <form action="">
        <input id="name" type="text" placeholder="Your Name" />
        <input id="email" type="email" placeholder="Email" />
        <select required>
          <option value disabled selected>Who do you want to contact</option>
          <option>Customer Service</option>
          <option>Partnership</option>
          <option>Press</option>
          <option>Legal</option>
        </select>
        <textarea
          name=""
          id=""
          cols="30"
          rows="10"
          placeholder="Your message"
        ></textarea>

        <a href="login.html"><button type="submit">Send message</button></a>
      </form>
      <div class="footer">
        <p>Find more details about us! <a href="#">here</a></p>
      </div>
    </div>
  </body>
</html>
